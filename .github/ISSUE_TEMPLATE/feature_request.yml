name: Feature request
description: Propose a Paper Distill workflow improvement
title: "[Feature]: "
body:
  - type: input
    id: workflow
    attributes:
      label: Corpus workflow
      description: Which distillation, resume, validation, or export task would this improve?
      placeholder: "For example: per-paper recovery or combined dataset validation"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the current limitation without including private paper content.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request contains no credentials, unpublished or copyrighted full text, private datasets, or personal information.
          required: true
