name: Bug report
description: Report a reproducible Paper Distill problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use a minimal synthetic paper. Remove API keys, private endpoints, unpublished papers, copyrighted full text, generated datasets, local paths, and personal information.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "For example: v1.0.0 or abc1234"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime environment
      description: Include the operating system, Python version, backend, and output format.
      placeholder: "Windows 11, Python 3.12, mock backend, conversation-jsonl"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable command sequence and a synthetic input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or artifact excerpt
      description: Include only the minimum relevant output after removing private paper content and credentials.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I used synthetic or publishable text and removed credentials, private endpoints, local paths, and personal information.
          required: true
